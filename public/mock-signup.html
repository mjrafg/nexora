<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Initech Notes — Create account</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f5f8;margin:0;color:#111}.wrap{max-width:440px;margin:56px auto;background:#fff;border-radius:14px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.08)}h1{font-size:20px;margin:0 0 4px}.sub{color:#666;margin:0 0 16px;font-size:13px}label{display:block;font-size:12px;color:#444;margin:12px 0 4px}input{width:100%;padding:10px;border:1px solid #d5d8e0;border-radius:8px;font-size:14px;box-sizing:border-box}button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:10px;background:#0f9d58;color:#fff;font-size:15px;font-weight:600;cursor:pointer}.step{display:none}.step.on{display:block}.note{margin-top:14px;padding:10px;border-radius:8px;background:#eef6ff;color:#245;font-size:12.5px}.err{display:none;margin-top:12px;padding:10px;border-radius:8px;background:#fdecec;color:#a11;font-size:13px}</style></head>
<body><div class="wrap">
<div class="step on" id="s1"><h1>Create your Initech Notes account</h1><p class="sub">Free plan · no card required</p><form onsubmit="return reg(event)"><label for="email">Work email</label><input id="email" type="email" required><label for="password">Password (12+ characters)</label><input id="password" type="password" minlength="12" required><label for="company">Company</label><input id="company" required><button type="submit">Create account</button></form></div>
<div class="step" id="s2"><h1>Verify your email</h1><p class="sub">We sent a 6-digit code to <span id="to"></span>.</p><div class="note">Test environment: the verification email is simulated. Your code is <strong id="code"></strong>.</div><form onsubmit="return verify(event)"><label for="otp">Verification code</label><input id="otp" inputmode="numeric" required><button type="submit">Verify</button><div class="err" id="err">Incorrect code.</div></form></div>
<div class="step" id="s3"><h1>Account ready</h1><p class="sub">Welcome to Initech Notes, <span id="who"></span>. Your workspace is ready. Account id: <strong id="acct"></strong></p></div>
</div>
<script>let code='',email='';function reg(e){e.preventDefault();email=document.getElementById('email').value.trim();if(document.getElementById('password').value.length<12){alert('Password too short');return false;}code=String(100000+Math.floor(Math.random()*900000));document.getElementById('to').textContent=email;document.getElementById('code').textContent=code;document.getElementById('s1').classList.remove('on');document.getElementById('s2').classList.add('on');document.title='Initech Notes — Verify email';return false;}
function verify(e){e.preventDefault();if(document.getElementById('otp').value.trim()===code){document.getElementById('s2').classList.remove('on');document.getElementById('s3').classList.add('on');document.getElementById('who').textContent=email;document.getElementById('acct').textContent='IN-'+Math.random().toString(36).slice(2,8).toUpperCase();document.title='Initech Notes — Account ready';}else{document.getElementById('err').style.display='block';}return false;}</script></body></html>
