<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>State Vendor Registry — Supplier registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f3f7;margin:0;color:#111}
.wrap{max-width:560px;margin:40px auto;background:#fff;border-radius:14px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 4px}.sub{color:#666;margin:0 0 18px}
label{display:block;font-size:12px;color:#444;margin:12px 0 4px}
input{width:100%;padding:10px;border:1px solid #d5d8e0;border-radius:8px;font-size:14px;box-sizing:border-box}
.req{background:#fff8e6;border:1px solid #f0d38a;padding:10px 12px;border-radius:8px;font-size:13px;margin:14px 0}
button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:10px;background:#1f6feb;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.err{color:#b00020;font-size:13px;margin-top:10px;display:none}
#done{display:none}.ok{background:#e9fbf0;border:1px solid #9fe3b8;padding:16px;border-radius:10px}
</style></head><body><div class="wrap">
<div id="form">
<h1>Supplier registration</h1>
<p class="sub">Register your company as an approved supplier.</p>
<div class="req"><strong>Required:</strong> this registry cannot accept a supplier without the company's official <strong>legal registration number</strong>. Estimates or placeholders are rejected.</div>
<form id="f" onsubmit="return submitForm(event)">
<label for="company">Legal company name</label><input name="company" id="company" required>
<label for="regnum">Legal registration number</label><input name="regnum" id="regnum" required>
<label for="email">Business email</label><input name="email" id="email" type="email" required>
<button type="submit" id="registerBtn">Register supplier</button>
<div class="err" id="err">A legal registration number is required.</div>
</form></div>
<div id="done" class="ok"><h1>Supplier registered</h1><p>Reference <strong id="ref"></strong>.</p></div>
</div>
<script>
let submitted=false;
function submitForm(e){e.preventDefault(); if(submitted) return false;
 const reg=document.getElementById('regnum').value.trim();
 if(!reg||!document.getElementById('company').value.trim()||!document.getElementById('email').value.trim()){document.getElementById('err').style.display='block';return false;}
 submitted=true;
 document.getElementById('ref').textContent='SR-'+Math.random().toString(36).slice(2,8).toUpperCase();
 document.getElementById('form').style.display='none';document.getElementById('done').style.display='block';
 document.title='Supplier registered';return false;}
</script></body></html>
