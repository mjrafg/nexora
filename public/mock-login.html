<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Acme Cloud — Sign in</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f5f8;margin:0;color:#111}.wrap{max-width:420px;margin:64px auto;background:#fff;border-radius:14px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.08)}h1{font-size:20px;margin:0 0 16px}label{display:block;font-size:12px;color:#444;margin:12px 0 4px}input{width:100%;padding:10px;border:1px solid #d5d8e0;border-radius:8px;font-size:14px;box-sizing:border-box}button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:10px;background:#3b5bff;color:#fff;font-size:15px;font-weight:600;cursor:pointer}.err{display:none;margin-top:12px;padding:10px;border-radius:8px;background:#fdecec;color:#a11;font-size:13px}#done{display:none}</style></head>
<body><div class="wrap"><div id="form"><h1>Sign in to Acme Cloud</h1><form onsubmit="return go(event)"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form><div class="err" id="err">Wrong email or password. Please try again.</div></div>
<div id="done"><h1>Welcome back, <span id="who"></span></h1><p>You are signed in to Acme Cloud. Dashboard: 3 projects, 12 deployments.</p></div></div>
<script>function go(e){e.preventDefault();const u=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('password').value;if(u==='tester@example.com'&&p==='Correct-Horse-Battery-9'){document.getElementById('form').style.display='none';document.getElementById('done').style.display='block';document.getElementById('who').textContent='tester';document.title='Acme Cloud — Dashboard';}else{document.getElementById('err').style.display='block';document.getElementById('password').value='';document.title='Acme Cloud — Sign in failed';}return false;}</script></body></html>
