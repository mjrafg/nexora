<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Globex Ads — Sign in</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f5f8;margin:0;color:#111}.wrap{max-width:420px;margin:64px auto;background:#fff;border-radius:14px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.08)}h1{font-size:20px;margin:0 0 4px}.sub{color:#666;margin:0 0 16px;font-size:13px}label{display:block;font-size:12px;color:#444;margin:12px 0 4px}input{width:100%;padding:10px;border:1px solid #d5d8e0;border-radius:8px;font-size:14px;box-sizing:border-box}button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:10px;background:#1a73e8;color:#fff;font-size:15px;font-weight:600;cursor:pointer}.err{display:none;margin-top:12px;padding:10px;border-radius:8px;background:#fdecec;color:#a11;font-size:13px}.step{display:none}.step.on{display:block}</style></head>
<body><div class="wrap">
<div class="step on" id="s1"><h1>Sign in</h1><p class="sub">Use your Globex Ads account</p><form onsubmit="return next(event)"><label for="identifier">Email or phone</label><input id="identifier" type="email" autocomplete="username" required><button type="submit">Next</button></form></div>
<div class="step" id="s2"><h1>Welcome</h1><p class="sub" id="acct"></p><form onsubmit="return signin(event)"><label for="pw">Enter your password</label><input id="pw" type="password" autocomplete="current-password" required><button type="submit">Next</button><div class="err" id="err">Wrong password. Try again or click Forgot password.</div></form></div>
<div class="step" id="s3"><h1>Globex Ads</h1><p class="sub">Signed in as <span id="who"></span>. Campaign dashboard: 2 active campaigns.</p></div>
</div>
<script>let id='';function next(e){e.preventDefault();id=document.getElementById('identifier').value.trim().toLowerCase();document.getElementById('acct').textContent=id;document.getElementById('s1').classList.remove('on');document.getElementById('s2').classList.add('on');document.title='Globex Ads — Password';return false;}
function signin(e){e.preventDefault();const p=document.getElementById('pw').value;if(id==='ads@example.com'&&p==='Globex-Ads-Pass-42'){document.getElementById('s2').classList.remove('on');document.getElementById('s3').classList.add('on');document.getElementById('who').textContent=id;document.title='Globex Ads — Dashboard';}else{document.getElementById('err').style.display='block';document.getElementById('pw').value='';document.title='Globex Ads — Wrong password';}return false;}</script></body></html>
